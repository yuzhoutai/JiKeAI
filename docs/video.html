<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>集客AI - AI视频</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="video" class="video-page">
  <header class="sub-header glass-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <div class="brand-mark">JK</div>
        <div class="brand-text"><strong>集客AI</strong><span>Every Marketer's AI</span></div>
      </a>
      <nav class="nav dark-nav">
        <a data-nav="home" href="index.html">首页</a>
        <a data-nav="workflow" href="workflow.html">AI工作流</a>
        <a data-nav="video" href="video.html">AI视频</a>
        <a data-nav="modeling" href="modeling.html">AI对话</a>
        <a data-nav="enterprise" href="enterprise.html">企业定制</a>
        <a data-nav="contact" href="contact.html">联系我们</a>
      </nav>
      <div class="nav-right">
        <div class="pill"><span class="coin-dot">◉</span> 161 <strong>| VIP</strong></div>
        <div class="pill">wx133467...</div>
      </div>
    </div>
  </header>

  <main class="video-studio">
    <div class="video-studio__toast" data-video-toast hidden>已为你切换到 即梦 2.0</div>

    <aside class="video-sidebar" aria-label="AI视频创作侧边栏">
      <div class="video-sidebar__top">
        <h1>开启创作</h1>
        <button class="video-sidebar__collapse" type="button" aria-label="收起侧边栏">▣</button>
      </div>

      <button class="video-new-chat is-active" type="button">
        <span>✎</span>
        <strong>新对话</strong>
      </button>

      <button class="video-default-create" type="button">
        <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=120&q=80" alt="默认创作">
        <strong>默认创作</strong>
      </button>

      <div class="video-history">
        <div class="video-history__title">最近</div>
        <button class="video-history__item" type="button"><span>▱</span><strong>商业街夜景环绕视频</strong><i>...</i></button>
        <button class="video-history__item" type="button"><span>▱</span><strong>轻奢客厅运镜方案</strong></button>
        <button class="video-history__item" type="button"><span>▱</span><strong>产品主图短视频</strong></button>
        <button class="video-history__item" type="button"><span>▱</span><strong>校园建筑鸟瞰展示</strong></button>
        <button class="video-history__item" type="button"><span>▱</span><strong>品牌发布会分镜</strong></button>
      </div>
    </aside>

    <section class="video-content" aria-label="AI视频创作区">
      <div class="video-content__center">
        <h2>你好，想创作什么？</h2>

        <form class="video-composer" action="#" method="post">
          <div class="video-composer__main">
            <div class="video-upload-grid" data-upload-grid>
              <button class="video-upload-card" type="button" data-upload-button>
                <input class="video-upload-card__input" type="file" accept="image/*" hidden>
                <span class="video-upload-card__plus">+</span>
                <strong data-upload-primary-label>上传主图</strong>
                <span data-upload-primary-tip>请上传高清的图片，清晰度会影响最终效果</span>
                <img class="video-upload-card__preview" alt="上传预览" hidden>
              </button>
            </div>

            <label class="video-composer__input-wrap">
              <span class="sr-only">输入描述</span>
              <textarea class="video-textarea" data-video-description placeholder="输入想法、脚本或上传参考，支持 “/” 使用技能，@ 添加主体，和 Agent 一起创作"></textarea>
            </label>
          </div>

          <div class="video-composer__bottom">
            <div class="video-composer__tools">
              <div class="video-select" data-video-type-select>
                <button class="video-select__trigger" type="button" data-video-type-trigger aria-expanded="false">
                  <span data-video-type-value>单图视频</span>
                </button>
                <div class="video-select__menu" data-video-type-menu hidden>
                  <button class="video-select__option is-selected" type="button" data-video-type="single">单图视频</button>
                  <button class="video-select__option" type="button" data-video-type="double">首尾帧视频</button>
                </div>
              </div>

              <button class="video-auto-btn" type="button">自动</button>

              <details class="video-settings">
                <summary>参数</summary>
                <div class="video-settings__panel">
                  <div class="video-settings__row">
                    <span>模型</span>
                    <div class="video-chip-group video-chip-group--models" aria-label="模型类型">
                      <button class="video-chip" type="button" data-video-model>即梦 1.0</button>
                      <button class="video-chip is-active" type="button" data-video-model>即梦 2.0</button>
                    </div>
                  </div>
                  <div class="video-settings__row">
                    <span>时长</span>
                    <div class="video-chip-group" data-video-toggle-group="duration" aria-label="视频时长">
                      <button class="video-chip is-active wide" type="button">8S</button>
                      <button class="video-chip wide" type="button">10S</button>
                      <button class="video-chip wide" type="button">15S</button>
                    </div>
                  </div>
                  <div class="video-settings__row">
                    <span>比例</span>
                    <div class="video-chip-group" data-video-toggle-group="ratio" aria-label="视频比例">
                      <button class="video-chip is-active wide" type="button">16:9</button>
                      <button class="video-chip wide" type="button">9:16</button>
                    </div>
                  </div>
                </div>
              </details>

              <button class="video-tool-btn video-tool-btn--wide" type="button">使用技能</button>
              <button class="video-tool-btn" type="button" aria-label="添加主体">@</button>
            </div>

            <button class="video-submit" type="submit" aria-label="开始生成视频">↑</button>
          </div>

          <div class="video-helper-text" data-upload-title>上传底图（必填）</div>
        </form>
      </div>
    </section>
  </main>

  <script src="assets/common.js"></script>
  <script src="assets/video-page.js"></script>
</body>
</html>
